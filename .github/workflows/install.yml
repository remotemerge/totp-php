name: Install

on:
  # Run the workflow on new releases
  release:
    types: [published]
    branches: [main]

# Let each release finish; a newer one must not cancel its smoke test
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

# Minimum required permissions for security
permissions:
  contents: read

jobs:
  install:
    # Run on the latest OS versions
    runs-on: ${{ matrix.os }}

    # Prevent hanging jobs
    timeout-minutes: 15

    strategy:
      # Run all matrix combinations to completion
      fail-fast: false
      matrix:
        # Define the OS and PHP versions to test
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}

      - name: Display PHP and Composer versions
        run: php --version && composer --version

      - name: Initialize a scratch project
        run: composer init --no-interaction --stability=stable

      - name: "Install dependencies"
        run: composer require remotemerge/totp-php
