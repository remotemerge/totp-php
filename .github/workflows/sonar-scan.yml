name: SonarQube Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

# Minimum required permissions for security
permissions:
  contents: read

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: sonar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Sonar needs full history for blame and new-code detection.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: xdebug
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --optimize-autoloader --prefer-dist

      - name: Run tests with coverage
        run: ./vendor/bin/phpunit
        env:
          XDEBUG_MODE: coverage

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Check SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
