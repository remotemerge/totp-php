name: Test

on:
  # Run on pull requests targeting the main branch
  pull_request:
    branches:
      - main

  # Run on pushes to the main branch
  push:
    branches:
      - main

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum required permissions for security
permissions:
  contents: read

jobs:
  test:
    # Test matrix across multiple OS and PHP versions
    runs-on: ${{ matrix.os }}

    # Prevent hanging jobs
    timeout-minutes: 15

    strategy:
      # Run all matrix combinations to completion
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    env:
      OS: ${{ matrix.os }}
      PHP: ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Display PHP and Composer versions
        run: php --version && composer --version

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --optimize-autoloader --prefer-dist

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --no-coverage
